name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft-release:
        description: Attach the APK to a draft release, which publishes nothing and creates no tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: npx --yes pnpm@12.9.1 install --frozen-lockfile
      - run: node scripts/build-android-apk.js demo
      - uses: actions/upload-artifact@v7
        with:
          name: ryt-transfer-demo-apk
          path: dist/ryt-transfer-demo.apk
          if-no-files-found: error
          # Free-plan private repos stop uploads at 500 MB, about seven of these; releases keep theirs.
          retention-days: 7

  release:
    needs: build
    if: github.event_name == 'push' || inputs.draft-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ryt-transfer-demo-apk
      - name: Publish the tag's release
        if: github.event_name == 'push'
        run: gh release create "$GITHUB_REF_NAME" ryt-transfer-demo.apk --verify-tag --generate-notes
      - name: Draft a release
        if: inputs.draft-release
        run: |
          tag="ci-proof-$GITHUB_RUN_ID"
          gh release create "$tag" ryt-transfer-demo.apk --draft --target "$GITHUB_SHA" --notes "Proves the release job; delete it."
          echo "Drafted $tag; delete it with: gh release delete $tag --yes" >> "$GITHUB_STEP_SUMMARY"
